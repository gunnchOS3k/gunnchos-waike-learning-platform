[package]
name = "waike-learning-client"
version = "0.1.0"
description = "WAIKE Learning OS native client (Tauri 2)"
authors = ["gunnchOS"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "waike_learning_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "waike-learning-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
aes-gcm = "0.10"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
tempfile = "3"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
dirs = "5"
once_cell = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
