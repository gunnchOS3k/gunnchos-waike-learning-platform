[project]
name = "course-compiler"
version = "0.1.0"
description = "WAIKE Learning OS course package compiler"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "PyNaCl>=1.5",
  "jsonschema>=4.22",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
course-compiler = "course_compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["course_compiler"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["."]
