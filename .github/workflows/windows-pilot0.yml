name: Windows Pilot 0

# Authentic Windows evidence for WAIKE Learning Platform (Tauri native).
# Authoritative runner: windows-2025. Optional compatibility: windows-latest.
# Never treats Linux/macOS as Windows proof. Cursor merges nothing.

on:
  pull_request:
  push:
    branches: [main, "cursor/windows-pilot0-authentic-evidence*"]
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: "Soak duration seconds (Pilot 0 requires >=1800 for PASS)"
        required: false
        default: "1800"

env:
  SOURCE_DATE_EPOCH: "1700000000"
  # Same documented development DB key used by Gate C/D / PR3 workflows (not production).
  WAIKE_DEV_DB_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  CARGO_TERM_COLOR: always
  WAIKE_PIN_REF: "fbf7685bc5686201ccaa0128ee83346d59b3d584"

jobs:
  windows-pilot0-windows-2025:
    name: windows-pilot0-windows-2025
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/waike-research-ops
          path: waike-research-ops
          ref: ${{ env.WAIKE_PIN_REF }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install Windows bundler deps (NSIS)
        shell: pwsh
        run: |
          # MSI/WiX is not assumed on hosted runners; Pilot 0 uses NSIS only.
          choco install nsis -y --no-progress
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
            if (Test-Path $nsis) { echo "C:\Program Files (x86)\NSIS" | Out-File -Append -FilePath $env:GITHUB_PATH }
          }
          Get-Command makensis -ErrorAction SilentlyContinue | Format-List
      - name: Align WAIKE pin provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          pin = Path("curriculum/registry/PIN.json")
          data = json.loads(pin.read_text())
          data["source_path"] = "./waike-research-ops"
          data["absolute_path_hint"] = str(Path("waike-research-ops").resolve())
          observed = subprocess.check_output(["git","-C","waike-research-ops","rev-parse","HEAD"], text=True).strip()
          if data["pinned_commit"] != observed:
              raise SystemExit(f"PROVENANCE_MISMATCH {data['pinned_commit']} != {observed}")
          pin.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Bootstrap Python + compile sample pack
        shell: bash
        run: |
          set -euo pipefail
          uv venv .venv
          # Windows venvs use Scripts/, Unix uses bin/ — never hardcode .venv/bin on windows-*.
          if [ -x .venv/Scripts/python.exe ]; then
            PY=".venv/Scripts/python.exe"
            export PATH="$(pwd)/.venv/Scripts:${PATH}"
          elif [ -x .venv/bin/python ]; then
            PY=".venv/bin/python"
            export PATH="$(pwd)/.venv/bin:${PATH}"
          else
            echo "venv python missing"; find .venv -maxdepth 3 -type f | head -50; exit 2
          fi
          uv pip install --python "$PY" -e tools/course_compiler cryptography PyNaCl
          course-compiler compile DIGITAL_CONFIDENCE --out pack_out
      - name: Install frontend deps (lockfile)
        working-directory: apps/client
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Build frontend + Tauri Windows bundles
        working-directory: apps/client
        shell: bash
        env:
          WAIKE_DEV_DB_KEY: ${{ env.WAIKE_DEV_DB_KEY }}
        run: |
          set -euo pipefail
          pnpm run build
          # Frontend already built; avoid tauri.conf beforeBuildCommand (npm) under pnpm layout.
          # Restrict to NSIS — do not require WiX/MSI on hosted runners.
          pnpm exec tauri build --config '{"build":{"beforeBuildCommand":""},"bundle":{"targets":["nsis"]}}'
      - name: Record runner image metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports/windows_pilot0 | Out-Null
          $meta = [ordered]@{
            ImageOS = $env:ImageOS
            ImageVersion = $env:ImageVersion
            RUNNER_OS = $env:RUNNER_OS
            RUNNER_ARCH = $env:RUNNER_ARCH
            RUNNER_NAME = $env:RUNNER_NAME
            GITHUB_SHA = $env:GITHUB_SHA
            recorded_at_utc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          $meta | ConvertTo-Json | Set-Content -Encoding utf8 reports/windows_pilot0/RUNNER_META.json
      - name: Collect Windows Pilot 0 evidence (incl. soak)
        shell: pwsh
        env:
          WINDOWS_PILOT0_SOAK_SECONDS: ${{ github.event.inputs.soak_seconds || '1800' }}
        run: |
          python scripts/windows_pilot0_evidence.py
      - name: Short SHA for artifacts
        id: meta
        shell: bash
        run: |
          SHORT="${GITHUB_SHA:0:12}"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: waike-windows-pilot0-${{ steps.meta.outputs.short_sha }}
          path: |
            apps/client/src-tauri/target/release/bundle/nsis/*
            reports/windows_pilot0/**
          retention-days: 14
          if-no-files-found: error

  windows-pilot0-windows-latest:
    name: windows-pilot0-windows-latest
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Windows bundler deps (NSIS)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
              echo "C:\Program Files (x86)\NSIS" | Out-File -Append -FilePath $env:GITHUB_PATH
            }
          }
      - name: Compatibility smoke — frontend + tauri build only
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec tauri build --config '{"build":{"beforeBuildCommand":""},"bundle":{"targets":["nsis"]}}'
      - name: Write compatibility note
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports/windows_pilot0 | Out-Null
          @{
            job = "windows-pilot0-windows-latest"
            role = "compatibility_smoke_not_authoritative"
            ImageOS = $env:ImageOS
            ImageVersion = $env:ImageVersion
            GITHUB_SHA = $env:GITHUB_SHA
          } | ConvertTo-Json | Set-Content -Encoding utf8 reports/windows_pilot0/WINDOWS_LATEST_COMPAT.json
      - uses: actions/upload-artifact@v4
        with:
          name: waike-windows-pilot0-latest-compat-${{ github.sha }}
          path: reports/windows_pilot0/WINDOWS_LATEST_COMPAT.json
          retention-days: 14
