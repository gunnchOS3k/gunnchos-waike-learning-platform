        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          pin = Path("curriculum/registry/PIN.json")
          data = json.loads(pin.read_text())
          data["source_path"] = "./waike-research-ops"
          data["absolute_path_hint"] = str(Path("waike-research-ops").resolve())
          observed = subprocess.check_output(["git","-C","waike-research-ops","rev-parse","HEAD"], text=True).strip()
          if data["pinned_commit"] != observed:
              raise SystemExit(f"PROVENANCE_MISMATCH {data['pinned_commit']} != {observed}")
          pin.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri/GTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libglib2.0-dev
      - name: Frontend build
        working-directory: apps/client
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: cargo check (required)
        working-directory: apps/client/src-tauri
        run: cargo check
      - name: Attempt tauri build (required attempt; record truthful result)
        working-directory: apps/client
        run: |
          set -euo pipefail
          mkdir -p ../../reports
          if pnpm exec tauri build 2>&1 | tee ../../reports/linux_tauri_build.log; then
            echo "LINUX_TAURI_BUILD=PASS" | tee ../../reports/LINUX_NATIVE_BUILD_RESULT.txt
          else
            echo "LINUX_TAURI_BUILD=FAILED" | tee ../../reports/LINUX_NATIVE_BUILD_RESULT.txt
            echo "See linux_tauri_build.log for dependency/packaging details."
            exit 1
          fi

  macos-native:
