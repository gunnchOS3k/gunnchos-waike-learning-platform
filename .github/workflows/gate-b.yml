  zero-skips:
    name: zero-skips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/waike-research-ops
          path: waike-research-ops
          ref: ${{ env.WAIKE_PIN_REF }}
      - uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/gunnchAI3k
          path: gunnchAI3k
          ref: ${{ env.GUNNCHAI_PIN_REF }}
      - uses: astral-sh/setup-uv@v4
      - name: Align WAIKE pin provenance
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          pin = Path("curriculum/registry/PIN.json")
          data = json.loads(pin.read_text())
          data["source_path"] = "./waike-research-ops"
          data["absolute_path_hint"] = str(Path("waike-research-ops").resolve())
          observed = subprocess.check_output(["git","-C","waike-research-ops","rev-parse","HEAD"], text=True).strip()
          if data["pinned_commit"] != observed:
              raise SystemExit(f"PROVENANCE_MISMATCH {data['pinned_commit']} != {observed}")
          pin.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Fail if any gate_b tests are skipped
        env:
          WAIKE_ROOT: ${{ github.workspace }}/waike-research-ops
          GUNNCHAI_ROOT: ${{ github.workspace }}/gunnchAI3k
          PYTHONPATH: tools/course_compiler:services/hub
          WAIKE_ALLOW_FAKE_AI: "1"
          GUNNCHAI_PROVIDER: fake
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python fastapi uvicorn pydantic httpx pytest pyyaml jsonschema argon2-cffi cryptography PyNaCl -e tools/course_compiler
          set +e
          OUT=$(.venv/bin/pytest -q tests/gate_b --tb=line 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUT"
          SKIPPED=$(printf '%s\n' "$OUT" | python3 -c 'import re,sys; t=sys.stdin.read(); m=re.search(r"(\d+) skipped", t); print(int(m.group(1)) if m else 0)')
          echo "GATE_B_REQUIRED_TESTS_SKIPPED=$SKIPPED"
          if [ "$SKIPPED" != "0" ]; then
            echo "zero-skips failed: required Gate B tests were skipped"
            exit 1
          fi
          exit $CODE

