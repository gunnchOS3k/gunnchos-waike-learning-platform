          pin.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Verify adapter against pinned gunnchAI source
        env:
          WAIKE_ROOT: ${{ github.workspace }}/waike-research-ops
          GUNNCHAI_ROOT: ${{ github.workspace }}/gunnchAI3k
          PYTHONPATH: services/hub
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python fastapi uvicorn pydantic httpx pytest pyyaml jsonschema argon2-cffi cryptography PyNaCl
          mkdir -p reports
          .venv/bin/python scripts/verify_gunnchai_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: gate-b-gunnchai-contract-snapshot
          path: |
            reports/GATE_B_GUNNCHAI_CONTRACT_SNAPSHOT.md
