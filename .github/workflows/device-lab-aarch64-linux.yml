# Device Lab: native aarch64 Linux Tauri artifact
#
# Motivation: Device OS Interactive Development Guest is aarch64. Gate D
# native-linux on ubuntu-latest produces x86_64 ELFs that cannot load on the
# guest without a full amd64 sysroot (qemu-user-static alone is insufficient
# for dynamically linked WebKit/GTK Tauri binaries).
#
# This workflow publishes an aarch64 ELF for Device Lab staging without
# reducing WAIKE product scope. Unmerged until owner accepts / re-freezes pins.

name: Device Lab aarch64 Linux

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/device-lab-aarch64-linux-ci
  pull_request:
    paths:
      - ".github/workflows/device-lab-aarch64-linux.yml"
      - "apps/client/**"

env:
  WAIKE_DEV_DB_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  WAIKE_PIN_REF: "fbf7685bc5686201ccaa0128ee83346d59b3d584"
  DEVICE_OS_PIN_REF: "4f02a48780d300a5d3a7758937b20e3bf9364d0d"
  GUNNCHAI_PIN_REF: "4b4f411710e8cdb8102a7e11502f8497f68156b1"

jobs:
  native-linux-aarch64:
    name: native-linux-aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - name: Install linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config \
            libglib2.0-dev
      - name: Build native aarch64 Linux artifact
        env:
          SOURCE_DATE_EPOCH: "1700000000"
          WAIKE_DEV_DB_KEY: ${{ env.WAIKE_DEV_DB_KEY }}
        run: |
          mkdir -p reports
          cd apps/client && pnpm install --frozen-lockfile && pnpm run build
          cd src-tauri && cargo build --release
          test -x target/release/waike-learning-client
          file target/release/waike-learning-client | tee ../../../reports/LINUX_AARCH64_FILE.txt
          file target/release/waike-learning-client | grep -E 'ARM aarch64|aarch64'
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$HEAD_SHA" ]; then HEAD_SHA="${{ github.sha }}"; fi
          sha256sum target/release/waike-learning-client | tee ../../../reports/LINUX_AARCH64_SHA256SUMS.txt
          {
            echo "artifact_head_sha=$HEAD_SHA"
            echo "arch=aarch64"
            echo "waike_pin_ref=${{ env.WAIKE_PIN_REF }}"
            echo "gunnchai_pin_ref=${{ env.GUNNCHAI_PIN_REF }}"
            echo "device_os_pin_ref=${{ env.DEVICE_OS_PIN_REF }}"
            echo "gate=Device Lab aarch64 Linux"
            echo "format=ELF_binary_not_zip"
            echo "guest_target=device_lab_interactive_development_guest_aarch64"
          } > ../../../reports/LINUX_AARCH64_ARTIFACT_META.txt
      - uses: actions/upload-artifact@v4
        with:
          name: waike-learning-os-device-lab-linux-aarch64
          path: |
            apps/client/src-tauri/target/release/waike-learning-client
            reports/LINUX_AARCH64_SHA256SUMS.txt
            reports/LINUX_AARCH64_ARTIFACT_META.txt
            reports/LINUX_AARCH64_FILE.txt
          retention-days: 14
          if-no-files-found: error
