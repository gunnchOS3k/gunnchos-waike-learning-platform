          DEVICE_OS_ROOT: ${{ github.workspace }}/gunnchos-device-os
          GUNNCHAI_ROOT: ${{ github.workspace }}/gunnchAI3k
          PYTHONPATH: services/hub
          WAIKE_ALLOW_FAKE_AI: "1"
        run: |
          .venv/bin/pytest -q \
            tests/compatibility tests/security tests/integration \
            tests/assessment tests/pr3 tests/gate_a services/hub/tests \
