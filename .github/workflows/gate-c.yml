      - uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/gunnchos-device-os
          path: gunnchos-device-os
          ref: ${{ env.DEVICE_OS_PIN_REF }}
      - uses: astral-sh/setup-uv@v4
      - name: Align WAIKE pin provenance
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          pin = Path("curriculum/registry/PIN.json")
          data = json.loads(pin.read_text())
          data["source_path"] = "./waike-research-ops"
          data["absolute_path_hint"] = str(Path("waike-research-ops").resolve())
          observed = subprocess.check_output(["git","-C","waike-research-ops","rev-parse","HEAD"], text=True).strip()
          if data["pinned_commit"] != observed:
              raise SystemExit(f"PROVENANCE_MISMATCH {data['pinned_commit']} != {observed}")
          pin.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Install Python deps
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python fastapi uvicorn pydantic httpx pytest pyyaml jsonschema argon2-cffi cryptography PyNaCl PyJWT

      - name: Adversarial security suites
        env:
          WAIKE_ROOT: ${{ github.workspace }}/waike-research-ops
          DEVICE_OS_ROOT: ${{ github.workspace }}/gunnchos-device-os
          GUNNCHAI_ROOT: ${{ github.workspace }}/gunnchAI3k
          PYTHONPATH: services/hub
          WAIKE_ALLOW_FAKE_AI: "1"
        run: |
          .venv/bin/pytest -q \
            tests/gate_c/test_oneroster_security.py \
            tests/gate_c/test_qti_security.py \
            tests/gate_c/test_lti_security.py \
            tests/gate_c/test_security_sabotage.py \
            --tb=short
          test -f reports/GATE_C_ADVERSARIAL_REVIEW.md || \
            echo "# Gate C Adversarial Review\n\nAutomated sabotage suites executed in CI.\n" > reports/GATE_C_ADVERSARIAL_REVIEW.md

  deviceos-real-tauri-runtime-e2e:
    name: deviceos-real-tauri-runtime-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/gunnchos-device-os
          path: gunnchos-device-os
          ref: ${{ env.DEVICE_OS_PIN_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - name: Install linux deps + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config libglib2.0-dev xvfb
      - name: Build actual Platform Linux Tauri binary
        env:
          SOURCE_DATE_EPOCH: "1700000000"
          WAIKE_DEV_DB_KEY: ${{ env.WAIKE_DEV_DB_KEY }}
        run: |
          cd apps/client && pnpm install --frozen-lockfile && pnpm run build
          cd src-tauri && cargo build --release
          test -x target/release/waike-learning-client
          # Guard: never substitute the Device OS protocol fixture for this job.
          ! test -ef "${{ github.workspace }}/gunnchos-device-os/fixtures/learning_os/waike-learning-os" \
            target/release/waike-learning-client
      - name: Real Device OS ↔ Tauri runtime E2E + sabotage
        env:
          DEVICE_OS_ROOT: ${{ github.workspace }}/gunnchos-device-os
          LEARNING_OS_REAL_BINARY: ${{ github.workspace }}/apps/client/src-tauri/target/release/waike-learning-client
          LEARNING_OS_APP_VERSION: "0.1.0"
          LEARNING_OS_PLATFORM_SHA: ${{ github.sha }}
          DEVICE_OS_PIN_REF: ${{ env.DEVICE_OS_PIN_REF }}
          WAIKE_CI_HEADLESS_UI: "1"
          CI_HEADLESS_UI: "1"
          LEARNING_OS_CLEANUP_AFTER_ACK: "1"
          WAIKE_DEV_DB_KEY: ${{ env.WAIKE_DEV_DB_KEY }}
          # Do not point NativeLaunchAdapter at the protocol fixture for this job.
          LEARNING_OS_EXECUTABLE: ""
        run: |
          unset LEARNING_OS_EXECUTABLE
          python3 scripts/deviceos_real_tauri_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deviceos-real-tauri-e2e-evidence
          path: |
            reports/DEVICEOS_REAL_TAURI_E2E.json
            reports/DEVICEOS_REAL_TAURI_E2E.md
            reports/DEVICEOS_REAL_TAURI_SABOTAGE.json
          retention-days: 14
          if-no-files-found: warn

