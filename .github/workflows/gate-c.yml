    name: native-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - name: Install linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libglib2.0-dev
      - name: Build frontend + tauri
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          cd apps/client && pnpm install --frozen-lockfile && pnpm run build
          cd src-tauri && cargo build --release
      - name: Record artifact meta
        id: meta
        run: |
          mkdir -p reports
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$HEAD_SHA" ]; then HEAD_SHA="${{ github.sha }}"; fi
          SHORT="${HEAD_SHA:0:12}"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
          echo "artifact_head_sha=$HEAD_SHA" > reports/LINUX_ARTIFACT_META.txt
          echo "waike_pin_ref=${{ env.WAIKE_PIN_REF }}" >> reports/LINUX_ARTIFACT_META.txt
          echo "device_os_pin_ref=${{ env.DEVICE_OS_PIN_REF }}" >> reports/LINUX_ARTIFACT_META.txt
          echo "signing_notarization=UNSIGNED_CI_BUILD" >> reports/LINUX_ARTIFACT_META.txt
      - uses: actions/upload-artifact@v4
        with:
          name: waike-learning-os-gate-c-linux-${{ steps.meta.outputs.short_sha }}
          path: |
            apps/client/src-tauri/target/release/waike*
            reports/LINUX_ARTIFACT_META.txt
          retention-days: 14
          if-no-files-found: error

