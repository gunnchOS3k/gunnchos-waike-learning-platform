          pnpm install --frozen-lockfile
          pnpm run build
      - name: cargo check (required)
        working-directory: apps/client/src-tauri
        run: cargo check
      - name: Attempt tauri build (required attempt; record truthful result)
        working-directory: apps/client
        run: |
          set -euo pipefail
          mkdir -p ../../reports
          if pnpm exec tauri build 2>&1 | tee ../../reports/linux_tauri_build.log; then
