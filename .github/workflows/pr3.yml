          pin = Path("curriculum/registry/PIN.json")
          data = json.loads(pin.read_text())
          data["source_path"] = "./waike-research-ops"
          data["absolute_path_hint"] = str(Path("waike-research-ops").resolve())
          observed = subprocess.check_output(["git","-C","waike-research-ops","rev-parse","HEAD"], text=True).strip()
          if data["pinned_commit"] != observed:
              raise SystemExit(f"PROVENANCE_MISMATCH {data['pinned_commit']} != {observed}")
          pin.write_text(json.dumps(data, indent=2) + "\n")
          PY
          uv venv .venv
          uv pip install --python .venv/bin/python -e tools/course_compiler cryptography PyNaCl jsonschema pyyaml pytest httpx fastapi uvicorn pydantic argon2-cffi
          cd apps/client && pnpm install --frozen-lockfile && cd ../..
          .venv/bin/course-compiler compile DIGITAL_CONFIDENCE --out pack_out
          PYTHONPATH=services/hub .venv/bin/pytest -q tests services/hub/tests
          cd apps/client/src-tauri && cargo test && cd ../../..
          cd apps/client && pnpm test && pnpm run build && cd ../..
          .venv/bin/python scripts/verify_pr3.py
      - name: Record PR head for reports artifact
        id: reports_meta
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$HEAD_SHA" ]; then HEAD_SHA="${{ github.sha }}"; fi
          echo "short_sha=${HEAD_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pr3-reports-${{ steps.reports_meta.outputs.short_sha }}
          path: reports/
          retention-days: 14
