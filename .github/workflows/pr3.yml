name: PR3

# Authoritative PR3 gate (identity, sections, enrollment, instructor, gradebook). Includes PR1 foundation checks.
# Do not mask claimed capabilities with continue-on-error / || true.

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

env:
  SOURCE_DATE_EPOCH: "1700000000"
  WAIKE_DEV_DB_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  CARGO_TERM_COLOR: always
  WAIKE_PIN_REF: "e97e74fc9bfb44b1cdc26b272dc4848264f15fe0"

jobs:
  contracts-compiler:
    name: contracts/compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/waike-research-ops
          path: waike-research-ops
          ref: ${{ env.WAIKE_PIN_REF }}
      - uses: astral-sh/setup-uv@v4
      - name: Align WAIKE path + verify provenance
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          pin_path = Path("curriculum/registry/PIN.json")
          data = json.loads(pin_path.read_text())
          data["source_path"] = "./waike-research-ops"
          data["absolute_path_hint"] = str(Path("waike-research-ops").resolve())
          observed = subprocess.check_output(["git","-C","waike-research-ops","rev-parse","HEAD"], text=True).strip()
          declared = data["pinned_commit"]
          if declared != observed:
              raise SystemExit(f"PROVENANCE_MISMATCH declared={declared} observed={observed}")
          pin_path.write_text(json.dumps(data, indent=2) + "\n")
          print("provenance_ok", observed)
          PY
      - name: Bootstrap + test
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e tools/course_compiler cryptography PyNaCl jsonschema pyyaml pytest
          .venv/bin/course-compiler compile DIGITAL_CONFIDENCE --out pack_out
          .venv/bin/pytest -q tests/compatibility tests/security tests/integration

  migration:
    name: migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/waike-research-ops
          path: waike-research-ops
          ref: ${{ env.WAIKE_PIN_REF }}
      - uses: astral-sh/setup-uv@v4
      - name: Align pin + run migration
        env:
          WAIKE_ROOT: ${{ github.workspace }}/waike-research-ops
          PYTHONPATH: services/hub
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          pin = Path("curriculum/registry/PIN.json")
          data = json.loads(pin.read_text())
          data["source_path"] = "./waike-research-ops"
          data["absolute_path_hint"] = str(Path("waike-research-ops").resolve())
          observed = subprocess.check_output(["git","-C","waike-research-ops","rev-parse","HEAD"], text=True).strip()
          if data["pinned_commit"] != observed:
              raise SystemExit(f"PROVENANCE_MISMATCH {data['pinned_commit']} != {observed}")
