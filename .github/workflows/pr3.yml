          pin.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Build frontend + tauri DMG
        env:
          WAIKE_DEV_DB_KEY: ${{ env.WAIKE_DEV_DB_KEY }}
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e tools/course_compiler cryptography PyNaCl
          .venv/bin/course-compiler compile DIGITAL_CONFIDENCE --out pack_out
          cd apps/client
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec tauri build
      - name: Verify DMG + write reports
        run: |
          python3 scripts/verify_macos_dmg.py
      - name: Record PR head SHA for artifact naming
        id: meta
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$HEAD_SHA" ]; then HEAD_SHA="${{ github.sha }}"; fi
          SHORT="${HEAD_SHA:0:12}"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
          echo "artifact_head_sha=$HEAD_SHA" > reports/MACOS_ARTIFACT_META.txt
          echo "waike_pin_ref=${{ env.WAIKE_PIN_REF }}" >> reports/MACOS_ARTIFACT_META.txt
      - uses: actions/upload-artifact@v4
        with:
          name: waike-learning-os-pr3-macos-${{ steps.meta.outputs.short_sha }}
          path: |
            apps/client/src-tauri/target/release/bundle/dmg/*.dmg
            reports/MACOS_DMG_VERIFICATION.md
            reports/MACOS_DMG_VERIFICATION.json
            reports/MACOS_SHA256SUMS.txt
            reports/MACOS_ARTIFACT_META.txt
