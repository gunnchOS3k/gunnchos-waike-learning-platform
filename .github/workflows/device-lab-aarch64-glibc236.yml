# Device Lab: Debian 12 / glibc-2.36 native aarch64 Tauri artifact
#
# Additive second ARM target alongside ubuntu-24.04-arm (aarch64-current).
# Interactive Guest is Debian 12 / glibc 2.36; Ubuntu 24.04 ARM ELFs need
# GLIBC_2.39 and cannot exec on that guest.
#
# Build: native ubuntu-24.04-arm runner + Debian 12 bookworm userspace
# (pinned node:20-bookworm). Real Tauri/WebKit/GTK. No qemu-user, no ELF
# string editing, no bundled newer glibc, no feature stripping.
#
# Fail-closed if measured max GLIBC symbol > 2.36.

name: Device Lab aarch64 glibc236

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/device-lab-aarch64-glibc236
  pull_request:
    paths:
      - ".github/workflows/device-lab-aarch64-glibc236.yml"
      - "apps/client/**"
      - "scripts/measure_max_glibc.py"
      - "docs/product/DEVICE_LAB_AARCH64_GLIBC236.md"
      - "docs/product/MULTI_ARCHITECTURE_SUPPORT.md"

env:
  WAIKE_DEV_DB_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  SOURCE_DATE_EPOCH: "1700000000"
  # Pinned arm64 manifest of node:20-bookworm (Debian 12 userspace).
  BOOKWORM_IMAGE: "node:20-bookworm@sha256:f5b23dfa20dc91f65416e7d8dbee9f7a728a5677a53f711a1047f0eaac77d8f0"
  GLIBC_MAX_ALLOWED: "2.36"

jobs:
  native-linux-aarch64-glibc236:
    name: native-linux-aarch64-glibc236
    runs-on: ubuntu-24.04-arm
    container:
      image: node:20-bookworm@sha256:f5b23dfa20dc91f65416e7d8dbee9f7a728a5677a53f711a1047f0eaac77d8f0
      options: --user root
    # Container default is dash (`sh`); require bash for pipefail / arrays.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian 12 build deps
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates curl git build-essential pkg-config file binutils \
            python3 \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libglib2.0-dev libssl-dev patchelf
          # Confirm host userspace is bookworm / glibc 2.36 class.
          cat /etc/os-release | tee /tmp/os-release.txt
          cat /etc/debian_version | tee /tmp/debian_version.txt
          ldd --version | head -n1 | tee /tmp/ldd_version.txt
          uname -m | tee /tmp/uname_m.txt
          test "$(uname -m)" = "aarch64" \
            || { echo "FATAL: container not native aarch64"; exit 1; }

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustc --version
          cargo --version

      - name: Enable pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          pnpm --version

      - name: Build native aarch64 glibc236 Linux artifact
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          WAIKE_DEV_DB_KEY: ${{ env.WAIKE_DEV_DB_KEY }}
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          mkdir -p reports
          BIN="apps/client/src-tauri/target/release/waike-learning-client"
          REPORTS="reports"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARTIFACT_SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          else
            ARTIFACT_SOURCE_SHA="${{ github.sha }}"
          fi
          test -n "$ARTIFACT_SOURCE_SHA"

          cd apps/client && pnpm install --frozen-lockfile && pnpm run build
          cd src-tauri && cargo build --release
          cd ../../..

          test -x "$BIN" || { echo "FATAL: missing artifact $BIN"; exit 1; }

          FILE_OUT="$(file "$BIN")"
          echo "$FILE_OUT" | tee "$REPORTS/LINUX_AARCH64_GLIBC236_FILE.txt"
          echo "$FILE_OUT" | grep -E 'ARM aarch64|aarch64' \
            || { echo "FATAL: wrong-arch (expected ARM aarch64 ELF)"; exit 1; }
          echo "$FILE_OUT" | grep -qi 'ELF' \
            || { echo "FATAL: not an ELF binary"; exit 1; }

          sha256sum "$BIN" | tee "$REPORTS/LINUX_AARCH64_GLIBC236_SHA256SUMS.txt"

          {
            echo "=== file ==="
            echo "$FILE_OUT"
            echo
            echo "=== readelf -h ==="
            readelf -h "$BIN"
            echo
            echo "=== dynamic interpreter (readelf -l) ==="
            readelf -l "$BIN" | awk '/Requesting program interpreter/{print; found=1} END{if(!found) exit 1}'
            echo
            echo "=== ldd ==="
            ldd "$BIN" || { echo "FATAL: ldd failed"; exit 1; }
          } | tee "$REPORTS/LINUX_AARCH64_GLIBC236_RUNTIME_DEPS.txt"

          # Fail-closed GLIBC gate (measured symbols, not container label).
          MAX_GLIBC="$(python3 scripts/measure_max_glibc.py \
            --max-allowed "${GLIBC_MAX_ALLOWED}" \
            --evidence-out "$REPORTS/LINUX_AARCH64_GLIBC236_GLIBC_SYMBOLS.txt" \
            "$BIN")"
          echo "measured_max_glibc=${MAX_GLIBC}" | tee "$REPORTS/LINUX_AARCH64_GLIBC236_GLIBC_MAX.txt"

          RUSTC_V="$(rustc --version)"
          CARGO_V="$(cargo --version)"
          NODE_V="$(node --version)"
          PNPM_V="$(pnpm --version)"
          RUST_HOST="$(rustc -vV | awk '/^host:/{print $2}')"
          RUST_TARGET="$RUST_HOST"
          PNPM_LOCK_SHA="$(sha256sum apps/client/pnpm-lock.yaml | awk '{print $1}')"
          CARGO_LOCK_SHA="$(sha256sum apps/client/src-tauri/Cargo.lock | awk '{print $1}')"
          ARTIFACT_FILENAME="$(basename "$BIN")"
          ARTIFACT_SHA256="$(awk '{print $1}' "$REPORTS/LINUX_AARCH64_GLIBC236_SHA256SUMS.txt")"
          INTERPRETER="$(readelf -l "$BIN" | awk -F: '/Requesting program interpreter/{gsub(/[\[\] ]/,"",$2); print $2}')"
          DEBIAN_VERSION="$(tr -d '\n' < /etc/debian_version)"
          OS_PRETTY="$(awk -F= '/^PRETTY_NAME=/{gsub(/"/,"",$2); print $2}' /etc/os-release)"
          LDD_VERSION="$(head -n1 /tmp/ldd_version.txt)"
          WEBKIT_VER="$(pkg-config --modversion webkit2gtk-4.1 2>/dev/null || echo unknown)"
          GTK_VER="$(pkg-config --modversion gtk+-3.0 2>/dev/null || echo unknown)"
          DEPS_SUMMARY="$(ldd "$BIN" | awk '{print $1}' | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')"

          # Intrinsic provenance only. No Device OS / gunnchAI SHAs.
          {
            echo "artifact_source_sha=${ARTIFACT_SOURCE_SHA}"
            echo "waike_source_sha=${ARTIFACT_SOURCE_SHA}"
            echo "waike_ref=${{ github.ref }}"
            echo "github_ref_name=${{ github.ref_name }}"
            echo "event_name=${{ github.event_name }}"
            echo "os=linux"
            echo "arch=aarch64"
            echo "target_id=aarch64-glibc236"
            echo "compatibility_label=linux-aarch64-glibc236"
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=${{ runner.arch }}"
            echo "runs_on=ubuntu-24.04-arm"
            echo "build_userspace=debian_12_bookworm_container"
            echo "base_image=${BOOKWORM_IMAGE}"
            echo "debian_version=${DEBIAN_VERSION}"
            echo "os_pretty_name=${OS_PRETTY}"
            echo "ldd_version=${LDD_VERSION}"
            echo "glibc_baseline=2.36"
            echo "measured_max_glibc=${MAX_GLIBC}"
            echo "elf_interpreter=${INTERPRETER}"
            echo "rust_host=${RUST_HOST}"
            echo "rust_target=${RUST_TARGET}"
            echo "artifact_filename=${ARTIFACT_FILENAME}"
            echo "artifact_sha256=${ARTIFACT_SHA256}"
            echo "file_summary=${FILE_OUT}"
            echo "format=ELF_binary_not_zip"
            echo "node_version=${NODE_V}"
            echo "pnpm_version=${PNPM_V}"
            echo "rustc_version=${RUSTC_V}"
            echo "cargo_version=${CARGO_V}"
            echo "pnpm_lock_sha256=${PNPM_LOCK_SHA}"
            echo "cargo_lock_sha256=${CARGO_LOCK_SHA}"
            echo "webkit2gtk_pkgconfig_version=${WEBKIT_VER}"
            echo "gtk3_pkgconfig_version=${GTK_VER}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH}"
            echo "reproducible_build_timestamp_policy=SOURCE_DATE_EPOCH_fixed"
            echo "curriculum_pin_consumed=false"
            echo "gate=Device Lab aarch64 glibc236"
            echo "canonical_build=native_arm64_runner_debian12_bookworm_userspace_not_qemu_user"
            echo "# optional_device_lab_context (non-intrinsic; not a pin coupling)"
            echo "guest_target_hint=device_lab_interactive_development_guest_debian12_glibc236"
          } > "$REPORTS/LINUX_AARCH64_GLIBC236_ARTIFACT_META.txt"

          python3 - <<PY
          import json, os
          from pathlib import Path
          reports = Path("reports")
          rt = {
            "schema_version": "waike.runtime_target.v1",
            "product": "waike-learning-client",
            "compatibility_label": "linux-aarch64-glibc236",
            "target_id": "aarch64-glibc236",
            "source_sha": "${ARTIFACT_SOURCE_SHA}",
            "artifact_filename": "${ARTIFACT_FILENAME}",
            "artifact_sha256": "${ARTIFACT_SHA256}",
            "os_family": "linux",
            "architecture": "aarch64",
            "rust_target_triple": "${RUST_TARGET}",
            "build_distro": "debian",
            "build_distro_version": "${DEBIAN_VERSION}",
            "build_os_pretty_name": "${OS_PRETTY}",
            "base_image": os.environ["BOOKWORM_IMAGE"],
            "glibc_baseline": "2.36",
            "measured_max_glibc": "${MAX_GLIBC}",
            "elf_interpreter": "${INTERPRETER}",
            "dynamic_dependency_summary": "${DEPS_SUMMARY}",
            "webkitgtk_requirements": {
              "pkgconfig_module": "webkit2gtk-4.1",
              "pkgconfig_version": "${WEBKIT_VER}",
            },
            "gtk_requirements": {
              "pkgconfig_module": "gtk+-3.0",
              "pkgconfig_version": "${GTK_VER}",
            },
            "toolchain": {
              "node": "${NODE_V}",
              "pnpm": "${PNPM_V}",
              "rustc": "${RUSTC_V}",
              "cargo": "${CARGO_V}",
              "pnpm_lock_sha256": "${PNPM_LOCK_SHA}",
              "cargo_lock_sha256": "${CARGO_LOCK_SHA}",
            },
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_attempt": "${{ github.run_attempt }}",
            "source_date_epoch": "${SOURCE_DATE_EPOCH}",
            "runs_on": "ubuntu-24.04-arm",
            "canonical_build": "native_arm64_runner_debian12_bookworm_userspace_not_qemu_user",
            "zero_surprise_contract_fields": [
              "architecture",
              "elf_interpreter",
              "measured_max_glibc",
              "glibc_baseline",
              "dynamic_dependency_summary",
              "webkitgtk_requirements",
              "gtk_requirements",
              "source_sha",
              "artifact_sha256",
            ],
          }
          out = reports / "RUNTIME_TARGET.json"
          out.write_text(json.dumps(rt, indent=2) + "\n", encoding="utf-8")
          print(out.read_text())
          PY

          # On main push, artifact_source_sha must equal github.sha (accepted-main).
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            grep -qx "artifact_source_sha=${{ github.sha }}" "$REPORTS/LINUX_AARCH64_GLIBC236_ARTIFACT_META.txt" \
              || { echo "FATAL: main push artifact_source_sha != github.sha"; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: waike-learning-os-linux-aarch64-glibc236
          path: |
            apps/client/src-tauri/target/release/waike-learning-client
            reports/LINUX_AARCH64_GLIBC236_SHA256SUMS.txt
            reports/LINUX_AARCH64_GLIBC236_ARTIFACT_META.txt
            reports/LINUX_AARCH64_GLIBC236_FILE.txt
            reports/LINUX_AARCH64_GLIBC236_RUNTIME_DEPS.txt
            reports/LINUX_AARCH64_GLIBC236_GLIBC_SYMBOLS.txt
            reports/LINUX_AARCH64_GLIBC236_GLIBC_MAX.txt
            reports/RUNTIME_TARGET.json
          retention-days: 14
          if-no-files-found: error
