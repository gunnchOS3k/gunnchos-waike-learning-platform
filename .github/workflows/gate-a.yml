              raise SystemExit(f"PROVENANCE_MISMATCH {data['pinned_commit']} != {observed}")
          pin.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Build frontend + tauri DMG
        env:
          WAIKE_DEV_DB_KEY: ${{ env.WAIKE_DEV_DB_KEY }}
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e tools/course_compiler cryptography PyNaCl
          .venv/bin/course-compiler compile DIGITAL_CONFIDENCE --out pack_out
          cd apps/client
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec tauri build
      - name: Verify DMG + write reports
        run: |
          python3 scripts/verify_macos_dmg.py
      - name: Record Gate A head SHA for artifact naming
        id: meta
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$HEAD_SHA" ]; then HEAD_SHA="${{ github.sha }}"; fi
          SHORT="${HEAD_SHA:0:12}"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
          echo "artifact_head_sha=$HEAD_SHA" > reports/MACOS_ARTIFACT_META.txt
          echo "waike_pin_ref=${{ env.WAIKE_PIN_REF }}" >> reports/MACOS_ARTIFACT_META.txt
          echo "signing_notarization=UNSIGNED_CI_BUILD" >> reports/MACOS_ARTIFACT_META.txt
      - uses: actions/upload-artifact@v4
        with:
          name: waike-learning-os-gate-a-macos-${{ steps.meta.outputs.short_sha }}
          path: |
            apps/client/src-tauri/target/release/bundle/dmg/*.dmg
            reports/MACOS_DMG_VERIFICATION.md
            reports/MACOS_DMG_VERIFICATION.json
            reports/MACOS_SHA256SUMS.txt
            reports/MACOS_ARTIFACT_META.txt
          retention-days: 14
          if-no-files-found: error

  verify-gate-a:
    name: verify-gate-a
    needs: [foundation-regression, auth-security, authorization, migration, sync-model, sync-api, offline-restart, idempotency, conflict, cross-device, attachment-security, quizzes, labs, discussions, groups, accommodations, grading-efficiency, learner-e2e, instructor-e2e, frontend, accessibility, rust, native-linux, adversarial-sabotage, macos-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/waike-research-ops
          path: waike-research-ops
          ref: ${{ env.WAIKE_PIN_REF }}
      - uses: astral-sh/setup-uv@v4
      - name: Align WAIKE pin provenance
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          pin = Path("curriculum/registry/PIN.json")
          data = json.loads(pin.read_text())
          data["source_path"] = "./waike-research-ops"
          data["absolute_path_hint"] = str(Path("waike-research-ops").resolve())
          observed = subprocess.check_output(["git","-C","waike-research-ops","rev-parse","HEAD"], text=True).strip()
          if data["pinned_commit"] != observed:
              raise SystemExit(f"PROVENANCE_MISMATCH {data['pinned_commit']} != {observed}")
          pin.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri/GTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libglib2.0-dev
      - name: Bootstrap + verify-gate-a
        env:
          WAIKE_ROOT: ${{ github.workspace }}/waike-research-ops
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e tools/course_compiler cryptography PyNaCl jsonschema pyyaml pytest httpx fastapi uvicorn pydantic argon2-cffi
          cd apps/client && pnpm install --frozen-lockfile && cd ../..
          .venv/bin/course-compiler compile DIGITAL_CONFIDENCE --out pack_out
          PYTHONPATH=services/hub .venv/bin/pytest -q tests services/hub/tests
          cd apps/client/src-tauri && cargo test && cd ../../..
          cd apps/client && pnpm test && pnpm run build && cd ../..
          .venv/bin/python scripts/verify_gate_a.py
      - name: Record PR head for reports artifact
        id: reports_meta
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$HEAD_SHA" ]; then HEAD_SHA="${{ github.sha }}"; fi
          echo "short_sha=${HEAD_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: gate-a-reports-${{ steps.reports_meta.outputs.short_sha }}
          path: reports/
          retention-days: 14
