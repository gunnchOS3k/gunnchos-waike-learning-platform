name: Gate D

# Authoritative Gate D — clean-room full-system acceptance + digital release-candidate gate.
# Do not mask claimed capabilities with continue-on-error / || true.
# Does not claim physical Device Quartet, production notarization, WCAG/FERPA/standards certification, or field pilot.

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

env:
  SOURCE_DATE_EPOCH: "1700000000"
  WAIKE_DEV_DB_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  CARGO_TERM_COLOR: always
  WAIKE_PIN_REF: "fbf7685bc5686201ccaa0128ee83346d59b3d584"
  GUNNCHAI_PIN_REF: "4b4f411710e8cdb8102a7e11502f8497f68156b1"
  DEVICE_OS_PIN_REF: "4f02a48780d300a5d3a7758937b20e3bf9364d0d"
  LEARNING_OS_EXECUTABLE: ${{ github.workspace }}/gunnchos-device-os/fixtures/learning_os/waike-learning-os
  LEARNING_OS_APP_VERSION: "0.1.0-fixture"
  LEARNING_OS_PLATFORM_SHA: ${{ github.sha }}

jobs:

  clean-room:
    name: clean-room
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/waike-research-ops
          path: waike-research-ops
          ref: ${{ env.WAIKE_PIN_REF }}
      - uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/gunnchos-device-os
          path: gunnchos-device-os
          ref: ${{ env.DEVICE_OS_PIN_REF }}
      - uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/gunnchAI3k
          path: gunnchAI3k
          ref: ${{ env.GUNNCHAI_PIN_REF }}
      - uses: astral-sh/setup-uv@v4
      - name: Align WAIKE pin provenance
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          pin = Path("curriculum/registry/PIN.json")
          data = json.loads(pin.read_text())
          data["source_path"] = "./waike-research-ops"
          data["absolute_path_hint"] = str(Path("waike-research-ops").resolve())
          observed = subprocess.check_output(["git","-C","waike-research-ops","rev-parse","HEAD"], text=True).strip()
          if data["pinned_commit"] != observed:
              raise SystemExit(f"PROVENANCE_MISMATCH {data['pinned_commit']} != {observed}")
          pin.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Install Python deps
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e tools/course_compiler fastapi uvicorn pydantic httpx pytest pyyaml jsonschema argon2-cffi cryptography PyNaCl PyJWT

      - name: Run clean-room

        env:
          WAIKE_ROOT: ${{ github.workspace }}/waike-research-ops
          DEVICE_OS_ROOT: ${{ github.workspace }}/gunnchos-device-os
          GUNNCHAI_ROOT: ${{ github.workspace }}/gunnchAI3k
          PYTHONPATH: tools/course_compiler:services/hub
          WAIKE_ALLOW_FAKE_AI: "1"
        run: |
          .venv/bin/python scripts/clean_room_reconstruct.py
          .venv/bin/pytest -q tests/gate_d/test_clean_room.py --tb=short

